<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2CA9E"/>
      <stop offset="50%" stop-color="#C6A36A"/>
      <stop offset="100%" stop-color="#8F6F3A"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A2433"/>
      <stop offset="100%" stop-color="#0B1018"/>
    </radialGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="120" height="120" rx="24" fill="url(#bgGlow)"/>
  <rect x="1" y="1" width="118" height="118" rx="23" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Subtle decorative inner line -->
  <rect x="8" y="8" width="104" height="104" rx="18" fill="none" stroke="#C6A36A" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- Typography Monogram YD. -->
  <text x="35" y="76" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="52" font-weight="600" fill="url(#goldGrad)" letter-spacing="-1">Y</text>
  <text x="63" y="76" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="52" font-weight="600" fill="url(#goldGrad)" letter-spacing="-1">D</text>
  <circle cx="100" cy="74" r="3.5" fill="url(#goldGrad)"/>
</svg>
